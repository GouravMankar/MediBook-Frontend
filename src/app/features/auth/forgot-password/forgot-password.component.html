<div class="auth-shell">
  <section>
    <div class="brand-large">MediBook</div>
    <h1>Reset access</h1>
    <p>Enter your registered email and we will send a one-time password.</p>
  </section>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card auth-card">
    <h2>Forgot password</h2>
    <p class="muted">Use the OTP sent to your email to set a new password.</p>

    <label>Email</label>
    <input formControlName="email" type="email" placeholder="Registered email" />
    <small
      class="field-error"
      *ngIf="form.controls.email.touched && form.controls.email.invalid"
    >
      Enter a valid email address
    </small>

    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="empty success-box" *ngIf="message">{{ message }}</div>

    <button class="btn" type="submit" [disabled]="loading || form.invalid">
      {{ loading ? "Sending..." : "Send OTP" }}
    </button>

    <p class="register-link"><a routerLink="/login">Back to login</a></p>
  </form>
</div>
