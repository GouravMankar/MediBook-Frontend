<div class="auth-shell">
  <section>
    <div class="brand-large">MediBook</div>
    <h1>Verify OTP</h1>
    <p>Enter the six-digit code sent to {{ email || "your email" }}.</p>
  </section>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card auth-card">
    <h2>OTP verification</h2>
    <p class="muted">The code expires shortly and can be used once.</p>

    <label>OTP</label>
    <input formControlName="otp" type="text" maxlength="6" placeholder="6-digit OTP" />
    <small
      class="field-error"
      *ngIf="form.controls.otp.touched && form.controls.otp.invalid"
    >
      Enter the 6-digit OTP
    </small>

    <div class="error" *ngIf="error">{{ error }}</div>

    <button class="btn" type="submit" [disabled]="loading || form.invalid || !email">
      {{ loading ? "Verifying..." : "Verify OTP" }}
    </button>

    <p class="register-link"><a routerLink="/forgot-password">Request a new OTP</a></p>
  </form>
</div>
