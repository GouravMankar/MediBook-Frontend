<div class="auth-shell">
  <section>
    <div class="brand-large">MediBook</div>
    <h1>New password</h1>
    <p>Set a strong password for {{ email || "your account" }}.</p>
  </section>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card auth-card">
    <h2>Reset password</h2>
    <p class="muted">Your OTP will be consumed after the password is changed.</p>

    <label>New password</label>
    <input formControlName="password" type="password" placeholder="Strong password" />
    <small
      class="field-error"
      *ngIf="form.controls.password.touched && form.controls.password.invalid"
    >
      {{ passwordMessage }}
    </small>

    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="empty success-box" *ngIf="success">{{ success }}</div>

    <button class="btn" type="submit" [disabled]="loading || form.invalid || !email || !otp">
      {{ loading ? "Saving..." : "Reset Password" }}
    </button>

    <p class="register-link"><a routerLink="/login">Back to login</a></p>
  </form>
</div>
